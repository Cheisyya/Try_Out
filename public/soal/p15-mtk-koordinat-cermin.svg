<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Bidang koordinat dengan sumbu X mendatar dari negatif 6 sampai 6 dan sumbu Y tegak dari negatif 8 sampai 4. Titik A ditandai pada koordinat 3 koma negatif 2 di kuadran keempat.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #16274c; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #16274c; }
  </style>

  <rect x="0" y="0" width="520" height="440" fill="#f5f7fb" />

  <!-- Skala: 1 satuan = 32 px. Titik asal (260, 160) -->
  <g class="grid">
    <path d="M68 32 V416" /><path d="M100 32 V416" /><path d="M132 32 V416" /><path d="M164 32 V416" />
    <path d="M196 32 V416" /><path d="M228 32 V416" /><path d="M292 32 V416" /><path d="M324 32 V416" />
    <path d="M356 32 V416" /><path d="M388 32 V416" /><path d="M420 32 V416" /><path d="M452 32 V416" />
    <path d="M60 32 H460" /><path d="M60 64 H460" /><path d="M60 96 H460" /><path d="M60 128 H460" />
    <path d="M60 192 H460" /><path d="M60 224 H460" /><path d="M60 256 H460" /><path d="M60 288 H460" />
    <path d="M60 320 H460" /><path d="M60 352 H460" /><path d="M60 384 H460" /><path d="M60 416 H460" />
  </g>

  <path class="sumbu" d="M52 160 H468" />
  <path class="sumbu" d="M260 24 V424" />

  <g class="teks" text-anchor="middle">
    <text x="68" y="176">−6</text>
    <text x="132" y="176">−4</text>
    <text x="196" y="176">−2</text>
    <text x="324" y="176">2</text>
    <text x="388" y="176">4</text>
    <text x="452" y="176">6</text>
  </g>
  <g class="teks" text-anchor="end">
    <text x="252" y="68">3</text>
    <text x="252" y="132">1</text>
    <text x="252" y="228">−2</text>
    <text x="252" y="292">−4</text>
    <text x="252" y="356">−6</text>
    <text x="252" y="420">−8</text>
  </g>

  <!-- titik A(3, -2) -> x = 260 + 96 = 356 ; y = 160 + 64 = 224 -->
  <circle cx="356" cy="224" r="6" fill="#c8953a" stroke="#16274c" stroke-width="2" />
  <text class="label" x="368" y="218">A(3, −2)</text>

  <text class="label" x="476" y="166">X</text>
  <text class="label" x="252" y="20">Y</text>
</svg>
