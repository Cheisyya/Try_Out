<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-label="Rangkaian listrik dengan baterai 12 volt. Hambatan R satu sebesar 2 ohm dipasang seri. Setelah R satu rangkaian bercabang dua: cabang atas berisi R dua sebesar 4 ohm, sedangkan cabang bawah berisi R tiga sebesar 4 ohm yang dipasang berderet dengan sebuah saklar S. Kedua cabang bertemu kembali sebelum kembali ke baterai.">
  <style>
    .kawat { fill: none; stroke: #16274c; stroke-width: 3; stroke-linecap: round; }
    .hambat { fill: #ffffff; stroke: #16274c; stroke-width: 3; }
    .plat { stroke: #16274c; stroke-width: 4; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; fill: #16274c; }
    .tebal { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #16274c; }
    .simpul { fill: #16274c; }
    .saklar { fill: none; stroke: #c8953a; stroke-width: 4; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="620" height="320" fill="#f5f7fb" />

  <!-- rangka luar -->
  <path class="kawat" d="M60 150 V70 H140" />
  <path class="kawat" d="M200 70 H300" />
  <path class="kawat" d="M480 70 H560 V260 H60 V190" />

  <!-- baterai 12 V -->
  <path class="plat" d="M38 150 H82" />
  <path class="plat" d="M50 168 H70" />
  <text class="tebal" x="96" y="176">12 V</text>

  <!-- R1 seri -->
  <rect class="hambat" x="140" y="56" width="60" height="28" rx="4" />
  <text class="teks" x="170" y="46" text-anchor="middle">R₁ = 2 Ω</text>

  <!-- simpul percabangan -->
  <circle class="simpul" cx="300" cy="70" r="5" />
  <circle class="simpul" cx="480" cy="70" r="5" />

  <!-- cabang atas: R2 -->
  <path class="kawat" d="M300 70 H360" />
  <rect class="hambat" x="360" y="56" width="60" height="28" rx="4" />
  <path class="kawat" d="M420 70 H480" />
  <text class="teks" x="390" y="46" text-anchor="middle">R₂ = 4 Ω</text>

  <!-- cabang bawah: R3 dan saklar S -->
  <path class="kawat" d="M300 70 V180 H340" />
  <rect class="hambat" x="340" y="166" width="60" height="28" rx="4" />
  <path class="kawat" d="M400 180 H428" />
  <circle class="simpul" cx="430" cy="180" r="5" />
  <path class="saklar" d="M430 180 L470 152" />
  <circle class="simpul" cx="474" cy="180" r="5" />
  <path class="kawat" d="M476 180 H480 V70" />
  <text class="teks" x="370" y="214" text-anchor="middle">R₃ = 4 Ω</text>
  <text class="tebal" x="452" y="140" text-anchor="middle">S</text>
</svg>
