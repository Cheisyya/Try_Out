<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Tiga pola persegi yang dibentuk dari batang korek api. Pola ke-1 berupa satu persegi yang tersusun atas 4 batang. Pola ke-2 berupa dua persegi berdampingan yang berbagi satu sisi dan tersusun atas 7 batang. Pola ke-3 berupa tiga persegi berdampingan yang tersusun atas 10 batang.">
  <style>
    .batang { stroke: #c8953a; stroke-width: 7; stroke-linecap: round; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #16274c; }
    .jumlah { font-weight: 400; fill: #4a5a7a; }
  </style>

  <rect x="0" y="0" width="560" height="200" fill="#f5f7fb" />

  <!-- Pola ke-1: satu persegi, sisi 56 px -->
  <g class="batang">
    <path d="M40 50 H96" /><path d="M40 106 H96" />
    <path d="M40 50 V106" /><path d="M96 50 V106" />
  </g>
  <text class="teks" x="68" y="140" text-anchor="middle">Pola ke-1</text>
  <text class="teks jumlah" x="68" y="162" text-anchor="middle">4 batang</text>

  <!-- Pola ke-2: dua persegi berdampingan -->
  <g class="batang">
    <path d="M170 50 H282" /><path d="M170 106 H282" />
    <path d="M170 50 V106" /><path d="M226 50 V106" /><path d="M282 50 V106" />
  </g>
  <text class="teks" x="226" y="140" text-anchor="middle">Pola ke-2</text>
  <text class="teks jumlah" x="226" y="162" text-anchor="middle">7 batang</text>

  <!-- Pola ke-3: tiga persegi berdampingan -->
  <g class="batang">
    <path d="M356 50 H524" /><path d="M356 106 H524" />
    <path d="M356 50 V106" /><path d="M412 50 V106" />
    <path d="M468 50 V106" /><path d="M524 50 V106" />
  </g>
  <text class="teks" x="440" y="140" text-anchor="middle">Pola ke-3</text>
  <text class="teks jumlah" x="440" y="162" text-anchor="middle">10 batang</text>
</svg>
