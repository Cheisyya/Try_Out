<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Bidang koordinat dengan dua garis lurus. Garis pertama melalui titik nol dan titik 2 koma 4 lalu terus naik. Garis kedua memotong sumbu Y di titik 0 koma 6 dan memotong sumbu X di titik 6 koma 0. Kedua garis berpotongan di titik 2 koma 4. Daerah segitiga yang dibatasi oleh sumbu X, garis pertama, dan garis kedua diarsir; titik-titik sudutnya adalah titik nol, titik 2 koma 4, dan titik 6 koma 0.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .garis { fill: none; stroke: #16274c; stroke-width: 3; }
    .garis2 { fill: none; stroke: #c8953a; stroke-width: 3; }
    .arsir { fill: #c8953a; fill-opacity: 0.3; stroke: none; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #16274c; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #16274c; }
  </style>

  <rect x="0" y="0" width="560" height="400" fill="#f5f7fb" />

  <!-- Skala: 1 satuan = 45 px. Titik asal di (70, 330) -->
  <g class="grid">
    <path d="M115 40 V345" /><path d="M160 40 V345" /><path d="M205 40 V345" />
    <path d="M250 40 V345" /><path d="M295 40 V345" /><path d="M340 40 V345" />
    <path d="M385 40 V345" /><path d="M430 40 V345" />
    <path d="M55 285 H470" /><path d="M55 240 H470" /><path d="M55 195 H470" />
    <path d="M55 150 H470" /><path d="M55 105 H470" /><path d="M55 60 H470" />
  </g>

  <!-- daerah arsir: (0,0) -> (2,4) -> (6,0) -->
  <polygon class="arsir" points="70,330 160,150 340,330" />

  <!-- garis kedua: memotong (0,6) dan (6,0) -->
  <path class="garis2" d="M70 60 L385 375" />
  <!-- garis pertama: melalui (0,0) dan (2,4), diteruskan sampai (3,6) -->
  <path class="garis" d="M70 330 L205 60" />

  <path class="sumbu" d="M40 330 H480" />
  <path class="sumbu" d="M70 30 V370" />

  <g class="teks" text-anchor="middle">
    <text x="115" y="350">1</text>
    <text x="160" y="350">2</text>
    <text x="205" y="350">3</text>
    <text x="250" y="350">4</text>
    <text x="295" y="350">5</text>
    <text x="340" y="350">6</text>
    <text x="385" y="350">7</text>
  </g>
  <g class="teks" text-anchor="end">
    <text x="62" y="290">1</text>
    <text x="62" y="245">2</text>
    <text x="62" y="200">3</text>
    <text x="62" y="155">4</text>
    <text x="62" y="110">5</text>
    <text x="62" y="65">6</text>
  </g>

  <circle cx="160" cy="150" r="5" fill="#16274c" />
  <circle cx="340" cy="330" r="5" fill="#c8953a" />
  <circle cx="70" cy="60" r="5" fill="#c8953a" />

  <text class="label" x="172" y="140">(2, 4)</text>
  <text class="label" x="344" y="322">(6, 0)</text>
  <text class="label" x="80" y="52">(0, 6)</text>
  <text class="label" x="486" y="336">X</text>
  <text class="label" x="62" y="26">Y</text>
</svg>
