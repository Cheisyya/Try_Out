<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Diagram lingkaran pilihan cabang olahraga 360 siswa. Bulu tangkis 30 persen, sepak bola 25 persen, voli 20 persen, renang 15 persen, dan cabang lainnya 10 persen.">
  <style>
    .juring { stroke: #f5f7fb; stroke-width: 3; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #16274c; }
    .persen { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .judul { font-size: 15px; font-weight: 700; fill: #16274c; }
  </style>

  <rect x="0" y="0" width="520" height="360" fill="#f5f7fb" />

  <!-- Pusat (170, 180), jari-jari 130. Sudut diukur searah jarum jam dari atas. -->
  <!-- Bulu tangkis 30% = 108 derajat: 0 sampai 108 -->
  <path class="juring" fill="#2a78d6" d="M170 180 L170 50 A130 130 0 0 1 293.6 220.2 Z" />
  <!-- Sepak bola 25% = 90 derajat: 108 sampai 198 -->
  <path class="juring" fill="#eb6834" d="M170 180 L293.6 220.2 A130 130 0 0 1 129.8 303.6 Z" />
  <!-- Voli 20% = 72 derajat: 198 sampai 270 -->
  <path class="juring" fill="#1baf7a" d="M170 180 L129.8 303.6 A130 130 0 0 1 40 180 Z" />
  <!-- Renang 15% = 54 derajat: 270 sampai 324 -->
  <path class="juring" fill="#eda100" d="M170 180 L40 180 A130 130 0 0 1 93.6 74.6 Z" />
  <!-- Lainnya 10% = 36 derajat: 324 sampai 360 -->
  <path class="juring" fill="#7c8db5" d="M170 180 L93.6 74.6 A130 130 0 0 1 170 50 Z" />

  <g class="teks persen" text-anchor="middle">
    <text x="228" y="126">30%</text>
    <text x="215" y="252">25%</text>
    <text x="112" y="256">20%</text>
    <text x="92" y="164">15%</text>
    <text x="136" y="88">10%</text>
  </g>

  <!-- keterangan warna -->
  <g class="teks">
    <rect x="330" y="66" width="18" height="18" fill="#2a78d6" />
    <text x="358" y="80">Bulu tangkis</text>
    <rect x="330" y="106" width="18" height="18" fill="#eb6834" />
    <text x="358" y="120">Sepak bola</text>
    <rect x="330" y="146" width="18" height="18" fill="#1baf7a" />
    <text x="358" y="160">Voli</text>
    <rect x="330" y="186" width="18" height="18" fill="#eda100" />
    <text x="358" y="200">Renang</text>
    <rect x="330" y="226" width="18" height="18" fill="#7c8db5" />
    <text x="358" y="240">Cabang lainnya</text>
  </g>

  <text class="judul" x="330" y="40">Pilihan olahraga 360 siswa</text>
</svg>
