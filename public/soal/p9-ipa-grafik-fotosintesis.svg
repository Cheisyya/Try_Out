<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Grafik hasil percobaan laju fotosintesis tanaman air. Sumbu datar menyatakan intensitas cahaya dalam satuan sembarang dari 0 sampai 10, sumbu tegak menyatakan laju fotosintesis dalam gelembung per menit dari 0 sampai 60. Kurva I diukur pada kadar karbon dioksida 0,04 persen: naik lurus sampai intensitas 4 lalu mendatar pada 20 gelembung per menit. Kurva II diukur pada kadar karbon dioksida 0,15 persen: naik lurus sampai intensitas 8 lalu mendatar pada 50 gelembung per menit.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .seri1 { fill: none; stroke: #2a78d6; stroke-width: 3.5; stroke-linejoin: round; }
    .seri2 { fill: none; stroke: #eb6834; stroke-width: 3.5; stroke-linejoin: round; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #16274c; }
    .label { font-size: 14px; font-weight: 700; }
  </style>

  <rect x="0" y="0" width="600" height="320" fill="#f5f7fb" />

  <!-- grid: tiap 2 satuan cahaya dan tiap 10 gelembung -->
  <g class="grid">
    <path d="M170 40 V250" /><path d="M270 40 V250" /><path d="M370 40 V250" />
    <path d="M470 40 V250" /><path d="M570 40 V250" />
    <path d="M70 215 H575" /><path d="M70 180 H575" /><path d="M70 145 H575" />
    <path d="M70 110 H575" /><path d="M70 75 H575" /><path d="M70 40 H575" />
  </g>

  <path class="sumbu" d="M70 250 H580" />
  <path class="sumbu" d="M70 35 V252" />

  <!-- skala cahaya: 1 satuan = 50 px -->
  <g class="teks" text-anchor="middle">
    <text x="70" y="270">0</text><text x="170" y="270">2</text>
    <text x="270" y="270">4</text><text x="370" y="270">6</text>
    <text x="470" y="270">8</text><text x="570" y="270">10</text>
  </g>

  <!-- skala laju: 10 gelembung = 35 px -->
  <g class="teks" text-anchor="end">
    <text x="62" y="255">0</text><text x="62" y="220">10</text>
    <text x="62" y="185">20</text><text x="62" y="150">30</text>
    <text x="62" y="115">40</text><text x="62" y="80">50</text>
    <text x="62" y="45">60</text>
  </g>

  <!-- kurva II: naik sampai (8, 50) lalu mendatar -->
  <path class="seri2" d="M70 250 L470 75 L570 75" />
  <!-- kurva I: naik sampai (4, 20) lalu mendatar -->
  <path class="seri1" d="M70 250 L270 185 L570 185" />

  <g class="teks label">
    <text x="500" y="66" fill="#eb6834">II — CO₂ 0,15%</text>
    <text x="500" y="205" fill="#2a78d6">I — CO₂ 0,04%</text>
  </g>

  <text class="teks label" x="320" y="292" text-anchor="middle">intensitas cahaya (satuan sembarang)</text>
  <text class="teks label" x="16" y="150" transform="rotate(-90 16 150)" text-anchor="middle">laju fotosintesis (gelembung/menit)</text>
</svg>
