<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Diagram batang pilihan kegiatan ekstrakurikuler 120 siswa. Sumbu tegak menyatakan banyak siswa dari 0 sampai 50 dengan garis bantu setiap 10 siswa. Pramuka dipilih 45 siswa, Basket 30 siswa, Musik 15 siswa, dan Robotik 30 siswa.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .batang { fill: #2a78d6; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #16274c; }
    .nilai { font-size: 14px; font-weight: 700; fill: #16274c; }
    .label { font-size: 14px; font-weight: 700; fill: #16274c; }
  </style>

  <rect x="0" y="0" width="560" height="320" fill="#f5f7fb" />

  <!-- grid tiap 10 siswa; 1 siswa = 4 px, dasar pada y = 250 -->
  <g class="grid">
    <path d="M80 210 H520" /><path d="M80 170 H520" /><path d="M80 130 H520" />
    <path d="M80 90 H520" /><path d="M80 50 H520" />
  </g>

  <path class="sumbu" d="M80 250 H525" />
  <path class="sumbu" d="M80 45 V252" />

  <g class="teks" text-anchor="end">
    <text x="72" y="255">0</text><text x="72" y="215">10</text>
    <text x="72" y="175">20</text><text x="72" y="135">30</text>
    <text x="72" y="95">40</text><text x="72" y="55">50</text>
  </g>

  <!-- batang -->
  <rect class="batang" x="112" y="70" width="70" height="180" />
  <rect class="batang" x="212" y="130" width="70" height="120" />
  <rect class="batang" x="312" y="190" width="70" height="60" />
  <rect class="batang" x="412" y="130" width="70" height="120" />

  <g class="nilai" text-anchor="middle">
    <text x="147" y="62">45</text>
    <text x="247" y="122">30</text>
    <text x="347" y="182">15</text>
    <text x="447" y="122">30</text>
  </g>

  <g class="teks" text-anchor="middle">
    <text x="147" y="270">Pramuka</text>
    <text x="247" y="270">Basket</text>
    <text x="347" y="270">Musik</text>
    <text x="447" y="270">Robotik</text>
  </g>

  <text class="label" x="300" y="298" text-anchor="middle">kegiatan ekstrakurikuler</text>
  <text class="label" x="16" y="150" transform="rotate(-90 16 150)" text-anchor="middle">banyak siswa</text>
</svg>
