<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="Sebuah lingkaran berpusat di titik O. Ruas garis AB merupakan diameter lingkaran yang digambar mendatar, dengan A di ujung kiri dan B di ujung kanan. Titik C terletak pada busur lingkaran di sebelah atas kanan, lalu dibuat ruas garis AC dan ruas garis BC sehingga terbentuk segitiga ABC. Sudut CAB yang terletak di titik A besarnya 32 derajat, sedangkan sudut ABC yang terletak di titik B diberi tanda tanya.">
  <style>
    .lingkaran { fill: #ffffff; stroke: #16274c; stroke-width: 2.5; }
    .sisi { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .diam { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .busur { fill: none; stroke: #c8953a; stroke-width: 2.5; }
    .titik { fill: #16274c; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #16274c; }
    .sudut { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #a3701f; }
  </style>

  <rect x="0" y="0" width="460" height="300" fill="#f5f7fb" />

  <!-- pusat (200,160), jari-jari 120; A(80,160) B(320,160) C(252.6,52.2) -->
  <circle class="lingkaran" cx="200" cy="160" r="120" />
  <path class="diam" d="M80 160 H320" />
  <path class="sisi" d="M80 160 L252.6 52.2 L320 160" />

  <circle class="titik" cx="80" cy="160" r="5" />
  <circle class="titik" cx="320" cy="160" r="5" />
  <circle class="titik" cx="252.6" cy="52.2" r="5" />
  <circle class="titik" cx="200" cy="160" r="4" />

  <text class="teks" x="62" y="182">A</text>
  <text class="teks" x="330" y="182">B</text>
  <text class="teks" x="262" y="42">C</text>
  <text class="teks" x="192" y="182">O</text>

  <!-- tanda sudut di A: dari arah AB (0 derajat) ke arah AC (32 derajat ke atas) -->
  <path class="busur" d="M130 160 A50 50 0 0 0 122.4 133.5" />
  <text class="sudut" x="140" y="146">32°</text>

  <!-- tanda sudut di B: dari arah BA ke arah BC -->
  <path class="busur" d="M270 160 A50 50 0 0 1 293.5 117.6" />
  <text class="sudut" x="262" y="140">?</text>
</svg>
