<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Grafik simpangan terhadap waktu sebuah benda yang bergetar. Sumbu datar menyatakan waktu dalam sekon dari 0 sampai 0,8 dan sumbu tegak menyatakan simpangan dalam sentimeter dari negatif 5 sampai 5. Kurva berbentuk gelombang dengan simpangan terbesar 5 sentimeter, dan satu getaran penuh berlangsung selama 0,4 sekon sehingga sepanjang 0,8 sekon terbentuk dua getaran penuh.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .kurva { fill: none; stroke: #c8953a; stroke-width: 3.5; }
    .putus { fill: none; stroke: #7c8db5; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #16274c; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #16274c; }
  </style>

  <rect x="0" y="0" width="600" height="300" fill="#f5f7fb" />

  <!-- Skala: 0,1 sekon = 60 px mulai x = 70; 1 cm tegak = 18 px, nol pada y = 150 -->
  <g class="grid">
    <path d="M70 60 H550" /><path d="M70 105 H550" /><path d="M70 195 H550" /><path d="M70 240 H550" />
    <path d="M130 55 V245" /><path d="M190 55 V245" /><path d="M250 55 V245" /><path d="M310 55 V245" />
    <path d="M370 55 V245" /><path d="M430 55 V245" /><path d="M490 55 V245" /><path d="M550 55 V245" />
  </g>

  <path class="sumbu" d="M70 150 H565" />
  <path class="sumbu" d="M70 50 V250" />

  <g class="teks" text-anchor="end">
    <text x="62" y="65">5</text>
    <text x="62" y="155">0</text>
    <text x="62" y="245">−5</text>
  </g>

  <g class="teks" text-anchor="middle">
    <text x="130" y="268">0,1</text>
    <text x="190" y="268">0,2</text>
    <text x="250" y="268">0,3</text>
    <text x="310" y="268">0,4</text>
    <text x="370" y="268">0,5</text>
    <text x="430" y="268">0,6</text>
    <text x="490" y="268">0,7</text>
    <text x="550" y="268">0,8</text>
  </g>

  <text class="label" x="310" y="292" text-anchor="middle">waktu (sekon)</text>
  <text class="label" x="22" y="150" text-anchor="middle" transform="rotate(-90 22 150)">simpangan (cm)</text>

  <!-- dua getaran penuh, periode 0,4 s = 240 px -->
  <path class="kurva" d="M70 150 C 100 60, 160 60, 190 150 C 220 240, 280 240, 310 150 C 340 60, 400 60, 430 150 C 460 240, 520 240, 550 150" />

  <g class="putus">
    <path d="M70 150 V60 M310 150 V60" />
    <path d="M70 60 H310" />
  </g>
  <text class="teks" x="190" y="50" text-anchor="middle">satu getaran penuh</text>
</svg>
