<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Grafik hasil percobaan pemuaian tiga batang logam P, Q, dan R yang panjang awalnya sama, yaitu 100 sentimeter. Sumbu datar kenaikan suhu dalam derajat Celsius dari 0 sampai 100, sumbu tegak pertambahan panjang dalam milimeter dari 0 sampai 2,4. Ketiga grafik berupa garis lurus dari titik nol. Pada kenaikan suhu 100 derajat, batang P bertambah panjang 2,4 milimeter, batang Q bertambah 1,8 milimeter, dan batang R bertambah 1,2 milimeter.">
  <style>
    .sumbu { fill: none; stroke: #16274c; stroke-width: 2.5; }
    .grid { fill: none; stroke: #c3d0e6; stroke-width: 1; }
    .seriP { fill: none; stroke: #2a78d6; stroke-width: 3.5; }
    .seriQ { fill: none; stroke: #eb6834; stroke-width: 3.5; }
    .seriR { fill: none; stroke: #1baf7a; stroke-width: 3.5; }
    .teks { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #16274c; }
    .label { font-size: 14px; font-weight: 700; }
  </style>

  <rect x="0" y="0" width="600" height="320" fill="#f5f7fb" />

  <!-- grid: tiap 20 derajat dan tiap 0,4 mm -->
  <g class="grid">
    <path d="M160 50 V250" /><path d="M250 50 V250" /><path d="M340 50 V250" />
    <path d="M430 50 V250" /><path d="M520 50 V250" />
    <path d="M70 216 H540" /><path d="M70 183 H540" /><path d="M70 150 H540" />
    <path d="M70 116 H540" /><path d="M70 83 H540" /><path d="M70 50 H540" />
  </g>

  <!-- sumbu -->
  <path class="sumbu" d="M70 250 H545" />
  <path class="sumbu" d="M70 45 V252" />

  <!-- skala suhu: 1 derajat = 4,5 px -->
  <g class="teks" text-anchor="middle">
    <text x="70" y="270">0</text><text x="160" y="270">20</text>
    <text x="250" y="270">40</text><text x="340" y="270">60</text>
    <text x="430" y="270">80</text><text x="520" y="270">100</text>
  </g>

  <!-- skala pertambahan panjang: 0,4 mm = 33,3 px -->
  <g class="teks" text-anchor="end">
    <text x="62" y="255">0</text><text x="62" y="221">0,4</text>
    <text x="62" y="188">0,8</text><text x="62" y="155">1,2</text>
    <text x="62" y="121">1,6</text><text x="62" y="88">2,0</text>
    <text x="62" y="55">2,4</text>
  </g>

  <!-- garis pemuaian: P 2,4 mm; Q 1,8 mm; R 1,2 mm pada 100 derajat -->
  <path class="seriP" d="M70 250 L520 50" />
  <path class="seriQ" d="M70 250 L520 100" />
  <path class="seriR" d="M70 250 L520 150" />

  <g class="teks label">
    <text x="528" y="54" fill="#2a78d6">P</text>
    <text x="528" y="104" fill="#eb6834">Q</text>
    <text x="528" y="154" fill="#1baf7a">R</text>
  </g>

  <text class="teks label" x="305" y="292" text-anchor="middle">kenaikan suhu (°C)</text>
  <text class="teks label" x="16" y="150" transform="rotate(-90 16 150)" text-anchor="middle">pertambahan panjang (mm)</text>
  <text class="teks" x="305" y="312" text-anchor="middle">panjang awal ketiga batang sama, yaitu 100 cm</text>
</svg>
